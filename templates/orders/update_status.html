{% extends "base.html" %}
{% block title %}Update order #{{ order.pk }}{% endblock %}
{% block content %}
<a class="back-link" href="{% url 'orders:detail' order.pk %}">← Back to order</a>
<div class="card form-card">
    <h1 class="title" style="margin-bottom:4px;">Update order #{{ order.pk }}</h1>
    <p class="subtle" style="margin-top:0;">{{ order.description|truncatewords:25 }}</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-block">Save</button>
    </form>
</div>
{% endblock %}
