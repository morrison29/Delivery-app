{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<div class="card form-card">
    <h1 class="title" style="margin-bottom:4px;">Create your account</h1>
    <p class="subtle" style="margin-top:0;">Takes a few seconds. Then place your first order.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-block">Sign up</button>
    </form>
    <p class="subtle" style="text-align:center;margin-bottom:0;">Already have an account? <a href="{% url 'accounts:login' %}">Login</a></p>
</div>
{% endblock %}
