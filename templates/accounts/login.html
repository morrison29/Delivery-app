{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="card form-card">
    <h1 class="title" style="margin-bottom:4px;">Welcome back</h1>
    <p class="subtle" style="margin-top:0;">Log in to place or manage orders.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-block">Login</button>
    </form>
    <p class="subtle" style="text-align:center;margin-bottom:0;">No account? <a href="{% url 'accounts:signup' %}">Sign up</a></p>
</div>
{% endblock %}
